<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construtor de Moléculas - TCC Química</title>
    <link rel="icon" type="image/png" href="arly.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                       "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Fira+Code:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Inter, system-ui, 'Segoe UI', Roboto, sans-serif;
            background:
                radial-gradient(1.5px 1.5px at 12% 18%, #fff9, transparent), radial-gradient(1px 1px at 78% 12%, #fff8, transparent),
                radial-gradient(1.5px 1.5px at 45% 70%, #fff6, transparent), radial-gradient(1px 1px at 88% 60%, #fff8, transparent),
                radial-gradient(1px 1px at 25% 85%, #fff7, transparent), radial-gradient(1.5px 1.5px at 62% 35%, #fff5, transparent),
                radial-gradient(circle at 15% 0%, #6d28d955, transparent 45%), radial-gradient(circle at 90% 100%, #2563eb44, transparent 45%),
                #050510;
            background-attachment: fixed;
            min-height: 100vh;
        }
        h1, h2, h3, button, .font-game { font-family: 'Space Grotesk', sans-serif; letter-spacing: -.01em; }
        .font-mono { font-family: 'Fira Code', monospace; }
        .btn-3d { box-shadow: 0 4px 0 #4c1d95; transition: transform .08s, box-shadow .08s; }
        .btn-3d:active { transform: translateY(3px); box-shadow: 0 1px 0 #4c1d95; }
        .btn-3d-cinza { box-shadow: 0 4px 0 #d1d5db; transition: transform .08s, box-shadow .08s; }
        .btn-3d-cinza:active { transform: translateY(3px); box-shadow: 0 1px 0 #d1d5db; }
        .cartao-nivel { box-shadow: 0 6px 0 #c4b5fd; }
        .cartao-nivel:active { transform: translateY(4px); box-shadow: 0 2px 0 #c4b5fd; }
        .flutuar { animation: flutuar 2.4s ease-in-out infinite; }
        @keyframes flutuar { 50% { transform: translateY(-8px) rotate(-4deg); } }
        .pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
        @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .confete { position: fixed; top: -14px; width: 9px; height: 14px; border-radius: 2px; z-index: 80; pointer-events: none; animation: cair linear forwards; }
        @keyframes cair { to { transform: translateY(105vh) rotate(720deg); } }
        /* o que o tutorial aponta: fica acima do véu, brilhando, e é a única coisa clicável */
        .foco { position: relative; z-index: 50; outline: 4px solid #facc15; outline-offset: 4px; border-radius: 1rem; animation: brilho 1.2s ease-in-out infinite; }
        #painel.foco { background: #fff; } /* o painel não tem fundo próprio: sem isso o véu escuro aparece por trás */
        @keyframes brilho { 50% { outline-color: rgba(250, 204, 21, .2); } }
        #painel { scrollbar-width: thin; scrollbar-color: #c4b5fd transparent; }
        #painel::-webkit-scrollbar { width: 6px; }
        #painel::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 99px; }
        #painel::-webkit-scrollbar-button { display: none; }
        #caixa canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
        svg.lucide { width: 1.1em; height: 1.1em; display: inline-block; vertical-align: -.15em; }
    </style>
</head>
<body class="text-gray-800 p-3 md:p-6">
<div class="max-w-6xl mx-auto space-y-4">

    <header class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl border border-gray-200 p-4 md:p-5 flex items-center gap-2 md:gap-3">
        <img src="arly.png" alt="Arly" class="w-9 h-9 md:w-12 md:h-12 shrink-0 object-contain drop-shadow-md">
        <div class="min-w-0">
            <h1 class="text-base sm:text-xl md:text-2xl leading-tight font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">Construtor de Moléculas</h1>
            <p class="hidden sm:block text-xs text-gray-500">Ligações | Valência | Isômeros | PubChem API</p>
        </div>
        <nav class="ml-auto flex gap-2 shrink-0">
            <button data-acao="tutorial" aria-label="Como jogar" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 md:px-4 py-2 rounded-xl text-sm font-semibold transition btn-3d-cinza"><i data-lucide="circle-help"></i><span class="hidden sm:inline">Como jogar</span></button>
            <button data-acao="niveis" aria-label="Blocos" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 md:px-4 py-2 rounded-xl text-sm font-semibold transition btn-3d-cinza"><i data-lucide="layers"></i><span class="hidden sm:inline">Blocos</span></button>
        </nav>
    </header>

    <section id="telaNivel" hidden class="bg-white/95 rounded-2xl shadow-2xl border border-gray-200 p-6 md:p-10 text-center"></section>

    <section id="bancada" class="bg-white/95 rounded-2xl shadow-2xl border border-gray-200 p-4 md:p-6">
        <div id="barraTopo" class="flex flex-wrap items-center gap-2 mb-4"></div>
        <div class="grid md:grid-cols-[1fr_17rem] gap-4">
            <div id="caixa" class="relative h-80 md:h-[28rem] bg-[#050510] rounded-2xl border-2 border-purple-500/40 shadow-inner overflow-hidden">
                <span class="absolute top-2 left-3 text-xs font-semibold text-purple-200/80 pointer-events-none z-10">BANCADA 3D</span>
                <div class="absolute top-2 right-2 z-10 flex flex-col gap-1">
                    <button data-acao="zoomMais" aria-label="Aproximar" class="w-9 h-9 grid place-items-center rounded-xl bg-white/10 hover:bg-white/20 text-purple-100"><i data-lucide="zoom-in"></i></button>
                    <button data-acao="zoomMenos" aria-label="Afastar" class="w-9 h-9 grid place-items-center rounded-xl bg-white/10 hover:bg-white/20 text-purple-100"><i data-lucide="zoom-out"></i></button>
                </div>
                <span class="absolute bottom-2 left-3 right-3 text-[11px] text-purple-200/70 pointer-events-none z-10">Clique em um átomo e depois em outro para ligar · clique numa ligação para desfazer · arraste o fundo para girar · + / − para zoom</span>
            </div>
            <aside id="painel" class="space-y-3 md:h-[28rem] md:overflow-y-auto md:pr-1"></aside>
        </div>
    </section>

    <p class="text-center text-[10px] text-gray-400">Powered by PubChem API</p>
</div>

<div id="veu" hidden class="fixed inset-0 z-40 bg-[#050510]/60 backdrop-blur-sm"></div>
<div id="falas" hidden class="fixed inset-x-0 top-3 md:top-6 z-[60] px-3"></div>

<script type="module" src="jogo.js"></script>
</body>
</html>
